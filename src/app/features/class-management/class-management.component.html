<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Classes</h1>
      <p class="page-subtitle">{{ classes.length }} classes</p>
    </div>
    <button class="btn-primary" (click)="openModal()">
      <lucide-icon name="plus" [size]="15"></lucide-icon> Create Class
    </button>
  </div>

  <p *ngIf="loading" class="hint-text">Chargement des classes...</p>
  <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

  <div class="class-grid" *ngIf="!loading">
    <div class="class-card" *ngFor="let cls of classes" (click)="openClass(cls)">
      <h3 class="class-name">{{ cls.name }}</h3>
      <p class="class-meta">{{ cls.student_count }} students · {{ cls.team_count }} teams</p>
      <span class="view-link">View Class <lucide-icon name="arrow-right" [size]="14"></lucide-icon></span>
    </div>
    <p *ngIf="classes.length === 0" class="hint-text">Aucune classe pour le moment.</p>
  </div>
</div>

<!-- Create Class Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <h2 class="modal-title">Create New Class</h2>
    <div class="modal-form">
      <div>
        <label>Class Name</label>
        <input [(ngModel)]="form.name" placeholder="e.g. INF3135 — Construction de logiciels" />
      </div>
      <div>
        <label>Course Code</label>
        <input [(ngModel)]="form.course_code" placeholder="e.g. INF3135" />
      </div>
      <div>
        <label>Year</label>
        <input [(ngModel)]="form.year" placeholder="e.g. H2025" />
      </div>
      <div>
        <label>Max Students</label>
        <input type="number" [(ngModel)]="form.max_students" placeholder="40" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="closeModal()">Cancel</button>
      <button class="btn-primary flex-1" [disabled]="isSaving" (click)="submitCreate()">
        {{ isSaving ? 'Création...' : 'Create Class' }}
      </button>
    </div>
  </div>
</div>
