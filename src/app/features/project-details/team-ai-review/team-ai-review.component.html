<div class="ai-review-page">
  <button class="back-btn" (click)="goBack()">
    <lucide-icon name="arrow-left" [size]="16"></lucide-icon> Back
  </button>

  <h1 class="page-title">AI Review — {{ teamName }}</h1>
  <p class="page-subtitle" *ngIf="repoName">Repository: {{ repoName }}</p>

  <p *ngIf="loading" class="hint-text">Chargement...</p>
  <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

  <h2 class="section-title" *ngIf="!loading && !errorMessage">Pull Requests</h2>

  <div class="pr-list" *ngIf="!loading && !errorMessage">
    <div class="pr-card" *ngFor="let pr of prs">
      <div class="pr-main">
        <p class="pr-title">#{{ pr.number }} {{ pr.title }}</p>

        <p class="pr-status" *ngIf="pr.already_reviewed">
          <lucide-icon name="check-circle" [size]="12" color="#16A34A"></lucide-icon>
          Reviewed · {{ formatDate(pr.reviewed_at) }}
        </p>
        <p class="pr-status not-reviewed" *ngIf="!pr.already_reviewed">Not reviewed</p>

        <p class="pr-score" *ngIf="pr.already_reviewed">
          Quality Score: <strong>{{ pr.quality_score }} / 10</strong>
        </p>
      </div>

      <button
        class="btn-outline"
        [class.btn-disabled]="!pr.already_reviewed"
        [disabled]="!pr.already_reviewed"
        (click)="viewReview(pr)"
      >
        {{ pr.already_reviewed ? 'View Review' : 'No Review' }}
      </button>
    </div>

    <p *ngIf="prs.length === 0" class="hint-text">Aucune pull request trouvée.</p>
  </div>
</div>
