<div class="dashboard-page">
  <h1 class="page-title">Welcome back, {{ auth.fullName }}</h1>
  <p class="page-subtitle">Here's an overview of your classes.</p>

  <div class="stats-row">
    <div class="stat-card">
      <p class="stat-value">{{ classes.length }}</p>
      <p class="stat-label">Classes</p>
    </div>
    <div class="stat-card">
      <p class="stat-value">{{ totalStudents }}</p>
      <p class="stat-label">Students</p>
    </div>
    <div class="stat-card">
      <p class="stat-value">{{ totalTeams }}</p>
      <p class="stat-label">Teams</p>
    </div>
  </div>

  <div class="section-header">
    <h2 class="section-title">Your Classes</h2>
    <button class="btn-outline" (click)="goToClasses()">View All</button>
  </div>

  <p *ngIf="loading" class="hint-text">Chargement...</p>

  <div class="class-grid" *ngIf="!loading">
    <div class="class-card" *ngFor="let cls of classes" (click)="openClass(cls)">
      <h3 class="class-name">{{ cls.name }}</h3>
      <p class="class-meta">{{ cls.student_count }} students · {{ cls.team_count }} teams</p>
    </div>
    <p *ngIf="classes.length === 0" class="hint-text">Tu n'as pas encore de classe.</p>
  </div>
</div>
